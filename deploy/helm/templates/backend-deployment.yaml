apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.backend.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:

      initContainers:
        - name: docker-config-init
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/docker
              cp /docker-host/config.json /tmp/docker/config.json
              chmod 600 /tmp/docker/config.json

          volumeMounts:
            - name: docker-config-dir
              mountPath: /tmp/docker

            - name: docker-host-config
              mountPath: /docker-host
              readOnly: true

      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: velocore-config

            - secretRef:
                name: velocore-secret

          env:
            - name: KUBECONFIG
              value: /etc/rancher/k3s/k3s.yaml

            - name: K3S_CONTAINERD_SOCKET
              value: /run/k3s/containerd/containerd.sock

            - name: DOCKER_CONFIG
              value: /tmp/docker

          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock

            - name: docker-config-dir
              mountPath: /tmp/docker

            - name: k3s-config
              mountPath: /etc/rancher/k3s
              readOnly: true

            - name: k3s-data
              mountPath: /var/lib/rancher/k3s
              readOnly: true

            - name: k3s-run
              mountPath: /run/k3s

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        - name: docker-config-dir
          emptyDir: {}

        - name: docker-host-config
          hostPath:
            path: /home/ubuntu/.docker
            type: Directory

        - name: k3s-config
          hostPath:
            path: /etc/rancher/k3s
            type: Directory

        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s
            type: Directory

        - name: k3s-run
          hostPath:
            path: /run/k3s
            type: Directory