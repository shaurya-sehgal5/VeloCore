apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:

        - name: grafana

          image: grafana/grafana:11.1.0

          ports:
            - containerPort: 3001

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123

          volumeMounts:

            - name: storage
              mountPath: /var/lib/grafana

            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources

      volumes:

        - name: storage
          persistentVolumeClaim:
            claimName: grafana-storage

        - name: datasource
          configMap:
            name: grafana-datasources