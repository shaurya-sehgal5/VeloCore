apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: {{ .Values.namespace }}

spec:

  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:

      labels:
        app: postgres

    spec:

      containers:

        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          ports:

            - containerPort: 5432

          env:

            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: velocore-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velocore-secret
                  key: DB_PASSWORD

          volumeMounts:

            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:

    - metadata:
        name: postgres-storage

      spec:

        accessModes:
          - ReadWriteOnce

        resources:

          requests:
            storage: 10Gi