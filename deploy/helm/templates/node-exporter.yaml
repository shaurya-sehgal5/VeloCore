apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  namespace: velocore

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostNetwork: true
      hostPID: true

      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2

          args:
            - --path.rootfs=/host

          ports:
            - containerPort: 9100

          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true

      volumes:
        - name: root
          hostPath:
            path: /

---

apiVersion: v1
kind: Service

metadata:
  name: node-exporter
  namespace: velocore

spec:
  selector:
    app: node-exporter

  ports:
    - port: 9100
      targetPort: 9100