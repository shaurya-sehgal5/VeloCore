apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Values.namespace }}

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:

      - name: velocore

        orgId: 1

        folder: VeloCore

        type: file

        disableDeletion: false

        editable: true

        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards