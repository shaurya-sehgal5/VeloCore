apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Values.namespace }}

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:

      - name: Platform

        orgId: 1

        folder: Platform

        type: file

        disableDeletion: false

        editable: true

        allowUiUpdates: true

        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards/platform

      - name: User

        orgId: 1

        folder: User

        type: file

        disableDeletion: false

        editable: true

        allowUiUpdates: true

        updateIntervalSeconds: 10

        options:
          path: /var/lib/grafana/dashboards/user