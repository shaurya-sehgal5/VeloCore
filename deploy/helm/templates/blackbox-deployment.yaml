apiVersion: apps/v1
kind: Deployment

metadata:
  name: blackbox-exporter
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: blackbox-exporter

  template:

    metadata:
      labels:
        app: blackbox-exporter

    spec:

      containers:

        - name: blackbox-exporter

          image: prom/blackbox-exporter:v0.25.0

          ports:
            - containerPort: 9115

          args:
            - --config.file=/etc/blackbox/blackbox.yml

          volumeMounts:
            - name: config
              mountPath: /etc/blackbox

      volumes:
        - name: config

          configMap:
            name: blackbox-config