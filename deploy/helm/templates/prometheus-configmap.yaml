apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: velocore

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:

      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend:8080

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: loki
        metrics_path: /metrics
        static_configs:
          - targets:
              - loki:3100

      - job_name: promtail
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            regex: promtail
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_ip
            target_label: __address__
            replacement: ${1}:9080

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics:8080

      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter:9100

      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor:8080

      - job_name: postgres-exporter
        static_configs:
          - targets:
              - postgres-exporter:9187

      - job_name: redis-exporter
        static_configs:
          - targets:
              - redis-exporter:9121

      - job_name: blackbox
        metrics_path: /probe

        params:
          module:
            - http_2xx

        static_configs:
          - targets:
              - http://frontend
              - http://backend:8080/api/health

        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target

          - source_labels:
              - __param_target
            target_label: instance

          - target_label: __address__
            replacement: blackbox-exporter:9115