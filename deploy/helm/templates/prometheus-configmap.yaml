apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend:8080

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: loki
        static_configs:
          - targets:
              - loki:3100

      - job_name: promtail
        static_configs:
          - targets:
              - promtail:9080