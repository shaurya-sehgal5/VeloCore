{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: velocore
  namespace: {{ .Values.namespace }}

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:

    - http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: frontend

                port:

                  number: 80

          - path: /api

            pathType: Prefix

            backend:

              service:

                name: backend

                port:

                  number: 8080

{{- end }}