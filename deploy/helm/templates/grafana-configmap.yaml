apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}

data:
  datasources.yaml: |
    apiVersion: 1

    datasources:

      - name: Prometheus
        uid: cfu6k2vm87gn4c
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

      - name: Loki
        uid: P8E80F9AEF21F6940
        type: loki
        access: proxy
        url: http://loki:3100
        editable: true