apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: promtail
  namespace: {{ .Values.namespace }}

spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      serviceAccountName: promtail

      containers:
        - name: promtail

          image: grafana/promtail:3.0.0

          args:
            - "-config.file=/etc/promtail/promtail.yaml"

          volumeMounts:
            - name: config
              mountPath: /etc/promtail

            - name: varlog
              mountPath: /var/log

            - name: pods
              mountPath: /var/log/pods
              readOnly: true

            - name: containers
              mountPath: /var/log/containers
              readOnly: true

            - name: positions
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: promtail-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: pods
          hostPath:
            path: /var/log/pods

        - name: containers
          hostPath:
            path: /var/log/containers

        - name: positions
          emptyDir: {}