apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: velocore

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-state-metrics

  template:
    metadata:
      labels:
        app: kube-state-metrics

    spec:
      serviceAccountName: kube-state-metrics

      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0

          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service

metadata:
  name: kube-state-metrics
  namespace: velocore

spec:
  selector:
    app: kube-state-metrics

  ports:
    - port: 8080
      targetPort: 8080

---

apiVersion: v1
kind: ServiceAccount

metadata:
  name: kube-state-metrics
  namespace: velocore

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kube-state-metrics

subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: velocore

roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io