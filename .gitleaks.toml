[extend]
useDefault = true

# Allowlist for specific files and patterns
[allowlist]
  # These files won't be scanned
  files = [
    '''\.lock$''',
    '''\.log$''',
    '''\.map$''',
    '''\.min\.js$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''pnpm-lock\.yaml$''',
    '''go\.sum$''',
    '''vendor/''',
    '''node_modules/''',
    '''\.git/''',
    '''\.idea/''',
    '''\.vscode/''',
  ]
  
  # These paths won't be scanned
  paths = [
    '''.env.example$''',
    '''docker-compose.*\.ya?ml$''',
    '''.gitignore$''',
  ]

# Custom rules for specific false positives
[[rules]]
  id = "allowlist-ips"
  description = "Allowlist known IPs for VeloCore"
  regex = '''3\.108\.30\.16|3\.110\.163\.70'''
  allowlist = [
    "3\\.108\\.30\\.16",
    "3\\.110\\.163\\.70"
  ]

[[rules]]
  id = "allowlist-docker-paths"
  description = "Allowlist Docker volume paths"
  regex = '''(/var/run/docker\.sock|/home/ubuntu/\.kube|/usr/local/bin/k3s|/run/k3s|/var/lib/rancher/k3s)'''
  allowlist = [
    "/var/run/docker.sock",
    "/home/ubuntu/.kube",
    "/usr/local/bin/k3s",
    "/run/k3s",
    "/var/lib/rancher/k3s"
  ]

# Custom rule for docker-compose specific patterns
[[rules]]
  id = "allowlist-docker-compose"
  description = "Allowlist docker-compose specific patterns"
  regex = '''shauryasehgal/velocore-backend|shauryasehgal/velocore-frontend'''
  allowlist = [
    "shauryasehgal/velocore-backend",
    "shauryasehgal/velocore-frontend"
  ]