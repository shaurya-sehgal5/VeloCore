apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.deploymentId }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Values.deploymentId }}
      slot: {{ .Values.slot }}

  template:
    metadata:
      labels:
        app: {{ .Values.deploymentId }}
        slot: {{ .Values.slot }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      containers:
        - name: app

          image: {{ .Values.image.repository | quote }}

          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: {{ .Values.deploymentId }}-config

          ports:
            - containerPort: {{ .Values.container.port }}

          {{- if eq .Values.type "backend" }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- else }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}