apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.deploymentId }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicas | default 1 }}

  selector:
    matchLabels:
      app: {{ .Values.deploymentId }}
      slot: {{ .Values.slot }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: {{ .Values.deploymentId }}
        slot: {{ .Values.slot }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:

      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      containers:
        - name: app

          image: {{ .Values.image.repository | quote }}

          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: {{ .Values.deploymentId }}-config

          {{- if .Values.startCommand }}
          command:
            - /bin/sh
            - -c
          args:
            - {{ .Values.startCommand | quote }}
          {{- end }}

          {{- if and .Values.container.port (ne .Values.type "worker") }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          {{- end }}

          {{- if (.Values.healthCheck | default dict).enabled }}

          {{- if eq .Values.type "backend" }}

          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          {{- else if eq .Values.type "frontend" }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          {{- end }}
          {{- end }}

          resources:
            {{- toYaml (.Values.resources | default dict) | nindent 12 }}