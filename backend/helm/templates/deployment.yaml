apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.deploymentId }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.deploymentId }}

  template:
    metadata:
      labels:
        app: {{ .Values.deploymentId }}

      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "{{ .Values.vault.role }}"
        vault.hashicorp.com/agent-inject-secret-app.env: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          DATABASE_URL={{`{{ .Data.data.DATABASE_URL }}`}}
          API_KEY={{`{{ .Data.data.API_KEY }}`}}
          JWT_SECRET={{`{{ .Data.data.JWT_SECRET }}`}}
          {{`{{- end }}`}}
      {{- end }}

    spec:

      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      initContainers:
        - name: docker-config-init
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/docker
              cp /docker-host/config.json /tmp/docker/config.json
              chmod 600 /tmp/docker/config.json

          volumeMounts:
            - name: docker-config-dir
              mountPath: /tmp/docker

            - name: docker-host-config
              mountPath: /docker-host
              readOnly: true

      containers:
        - name: backend

          image: {{ .Values.image.repository | quote }}

          imagePullPolicy: Always

          command:
            - sh
            - -c
            - |
              cp /etc/rancher/k3s/k3s.yaml /tmp/kubeconfig
              sed -i 's#https://127.0.0.1:6443#https://kubernetes.default.svc:443#g' /tmp/kubeconfig
              export KUBECONFIG=/tmp/kubeconfig
              exec npm start

          ports:
            - containerPort: {{ .Values.container.port }}

          envFrom:
            - configMapRef:
                name: velocore-config

            - secretRef:
                name: velocore-secret

          env:
            - name: KUBECONFIG
              value: /tmp/kubeconfig

            - name: K3S_CONTAINERD_SOCKET
              value: /run/k3s/containerd/containerd.sock

            - name: DOCKER_CONFIG
              value: /tmp/docker

          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock

            - name: docker-config-dir
              mountPath: /tmp/docker

            - name: k3s-config
              mountPath: /etc/rancher/k3s
              readOnly: true

            - name: k3s-data
              mountPath: /var/lib/rancher/k3s
              readOnly: true

            - name: k3s-run
              mountPath: /run/k3s

          {{- if eq .Values.type "backend" }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        - name: docker-config-dir
          emptyDir: {}

        - name: docker-host-config
          hostPath:
            path: /home/ubuntu/.docker
            type: Directory

        - name: k3s-config
          hostPath:
            path: /etc/rancher/k3s
            type: Directory

        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s
            type: Directory

        - name: k3s-run
          hostPath:
            path: /run/k3s
            type: Directory