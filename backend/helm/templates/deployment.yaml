apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.deploymentId }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicas | default 1 }}

  selector:
    matchLabels:
      app: {{ .Values.deploymentId }}
      slot: {{ .Values.slot }}

  template:
    metadata:
      labels:
        app: {{ .Values.deploymentId }}
        slot: {{ .Values.slot }}

      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"

        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}

        vault.hashicorp.com/agent-inject-secret-app.env: {{ .Values.vault.secretPath | quote }}

        vault.hashicorp.com/agent-inject-template-app.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          {{`{{- range $key, $value := .Data.data }}`}}
          {{`{{ $key }}={{ $value }}`}}
          {{`{{- end }}`}}
          {{`{{- end }}`}}
      {{- end }}

    spec:

      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      containers:
        - name: app

          image: {{ .Values.image.repository | quote }}

          imagePullPolicy: IfNotPresent

          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          ports:
            - containerPort: {{ .Values.container.port }}

          {{- if eq .Values.type "backend" }}

          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path | default "/health" }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- else }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}