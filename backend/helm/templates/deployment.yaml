apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.deploymentId }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.deploymentId }}

  template:
    metadata:
      labels:
        app: {{ .Values.deploymentId }}

      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "{{ .Values.vault.role }}"
        vault.hashicorp.com/agent-inject-secret-app.env: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" }}`}}
          DATABASE_URL={{`{{ .Data.data.DATABASE_URL }}`}}
          API_KEY={{`{{ .Data.data.API_KEY }}`}}
          JWT_SECRET={{`{{ .Data.data.JWT_SECRET }}`}}
          {{`{{- end }}`}}
      {{- end }}

    spec:

      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      containers:
        - name: app

          image: {{ .Values.image.repository | quote }}

          imagePullPolicy: Always

          ports:
            - containerPort: {{ .Values.container.port }}

          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          {{- if eq .Values.type "backend" }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- else }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.container.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
