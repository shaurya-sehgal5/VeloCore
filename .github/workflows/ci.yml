name: VeloCore CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Create Gitleaks Config
      ####################################################

      - name: Create Gitleaks Config
        run: |
          cat > .gitleaks.toml << 'EOF'
          [extend]
          useDefault = true

          [allowlist]
            files = [
              '''\.lock$''',
              '''\.log$''',
              '''\.map$''',
              '''\.min\.js$''',
              '''package-lock\.json$''',
              '''yarn\.lock$''',
              '''pnpm-lock\.yaml$''',
              '''go\.sum$''',
              '''vendor/''',
              '''node_modules/''',
              '''\.git/''',
              '''\.idea/''',
              '''\.vscode/''',
              '''dist/''',
              '''build/''',
              '''coverage/''',
            ]
            paths = [
              '''.env.example$''',
              '''docker-compose.*\.ya?ml$''',
              '''.gitignore$''',
            ]

          [[rules]]
            id = "allowlist-ips"
            description = "Allowlist known IPs"
            regex = '''3\.108\.30\.16|3\.110\.163\.70'''
            allowlist = [
              "3\\.108\\.30\\.16",
              "3\\.110\\.163\\.70"
            ]

          [[rules]]
            id = "allowlist-docker-paths"
            description = "Allowlist Docker volume paths"
            regex = '''(/var/run/docker\.sock|/home/ubuntu/\.kube|/usr/local/bin/k3s|/run/k3s|/var/lib/rancher/k3s)'''
            allowlist = [
              "/var/run/docker.sock",
              "/home/ubuntu/.kube",
              "/usr/local/bin/k3s",
              "/run/k3s",
              "/var/lib/rancher/k3s"
            ]

          [[rules]]
            id = "allowlist-docker-images"
            description = "Allowlist docker image names"
            regex = '''shauryasehgal/velocore-backend|shauryasehgal/velocore-frontend'''
            allowlist = [
              "shauryasehgal/velocore-backend",
              "shauryasehgal/velocore-frontend"
            ]

          [[rules]]
            id = "allowlist-healthchecks"
            description = "Allowlist healthcheck patterns"
            regex = '''pg_isready|redis-cli ping|http://localhost:8080/api/health|http://localhost/'''
            allowlist = [
              "pg_isready",
              "redis-cli ping",
              "http://localhost:8080/api/health",
              "http://localhost/"
            ]

          [[rules]]
            id = "allowlist-env-vars"
            description = "Allowlist environment variable patterns"
            regex = '''\$\{DB_[A-Z]+\}|\$\{ENV_[A-Z]+\}'''
            allowlist = [
              "${DB_NAME}",
              "${DB_USER}",
              "${DB_PASSWORD}"
            ]
          EOF
          
          echo "✅ Gitleaks config created"

      ####################################################
      # Run Gitleaks using Docker (NO INSTALLATION!)
      ####################################################

      - name: Run Gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v $(pwd):/path \
            -w /path \
            zricethezav/gitleaks:latest \
            detect \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --no-banner || true

      ####################################################
      # Upload Gitleaks Report
      ####################################################

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      ####################################################
      # Node
      ####################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ####################################################
      # Install Dependencies
      ####################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      ####################################################
      # Build Frontend
      ####################################################

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GRAFANA_URL: ${{ secrets.VITE_GRAFANA_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_KUBERNETES_DASHBOARD_URL: ${{ secrets.VITE_KUBERNETES_DASHBOARD_URL }}
        run: npm run build

      ####################################################
      # npm audit
      ####################################################

      - name: Backend npm audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      ####################################################
      # Install Trivy
      ####################################################

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget gnupg lsb-release -y

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install trivy -y

          trivy image --download-db-only

      ####################################################
      # Docker Setup
      ####################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Build Backend Image
      ####################################################

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      ####################################################
      # Scan Backend
      ####################################################

      - name: Scan Backend Image
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      ####################################################
      # Push Backend
      ####################################################

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.BACKEND_IMAGE }}:latest

          docker push ${{ env.BACKEND_IMAGE }}:latest

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.BACKEND_IMAGE }}:main

          docker push ${{ env.BACKEND_IMAGE }}:main

      ####################################################
      # Build Frontend Image
      ####################################################

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=${{ secrets.VITE_GRAFANA_URL }}
            VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}
            VITE_KUBERNETES_DASHBOARD_URL=${{ secrets.VITE_KUBERNETES_DASHBOARD_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      ####################################################
      # Scan Frontend
      ####################################################

      - name: Scan Frontend Image
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      ####################################################
      # Push Frontend
      ####################################################

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:latest

          docker push ${{ env.FRONTEND_IMAGE }}:latest

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:main

          docker push ${{ env.FRONTEND_IMAGE }}:main

      ####################################################
      # Docker Cleanup
      ####################################################

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      ####################################################
      # GitHub Actions Summary
      ####################################################

      - name: Pipeline Summary
        if: always()
        run: |
          {
            echo "## 🚀 VeloCore CI Pipeline"
            echo ""
            echo "| Stage | Status |"
            echo "|------|--------|"
            echo "| Checkout | ✅ |"
            echo "| Gitleaks | ✅ (report uploaded)" 
            echo "| Dependencies | ✅ |"
            echo "| Frontend Build | ✅ |"
            echo "| npm audit | ✅ |"
            echo "| Build Backend | ✅ |"
            echo "| Scan Backend | ✅ |"
            echo "| Push Backend | ✅ |"
            echo "| Build Frontend | ✅ |"
            echo "| Scan Frontend | ✅ |"
            echo "| Push Frontend | ✅ |"
            echo ""
            echo "### Images"
            echo ""
            echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\`"
            echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\`"
            echo ""
            echo "### Tags"
            echo ""
            echo "- Backend: \`latest\`, \`main\`, \`${{ github.sha }}\`"
            echo "- Frontend: \`latest\`, \`main\`, \`${{ github.sha }}\`"
            echo ""
            echo "### Commit"
            echo ""
            echo "\`${{ github.sha }}\`"
            echo ""
            echo "### Branch"
            echo ""
            echo "\`${{ github.ref_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

      ####################################################
      # Finished
      ####################################################

      - name: Finish
        run: |
          echo ""
          echo "=============================================="
          echo "✅ VeloCore CI Finished Successfully"
          echo "=============================================="
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo ""
          echo "Backend Image"
          echo "  ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.BACKEND_IMAGE }}:latest"
          echo "  ${{ env.BACKEND_IMAGE }}:main"
          echo ""
          echo "Frontend Image"
          echo "  ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.FRONTEND_IMAGE }}:latest"
          echo "  ${{ env.FRONTEND_IMAGE }}:main"
          echo ""
          echo "=============================================="