name: VeloCore CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      ####################################################
      # Checkout
      ####################################################

      - name: Checkout
        uses: actions/checkout@v4

      ####################################################
      # Node
      ####################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ####################################################
      # Install
      ####################################################

      - name: Install Backend
        working-directory: backend
        run: npm ci

      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      ####################################################
      # Build Frontend
      ####################################################

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://3.108.30.16
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GRAFANA_URL: http://localhost:3002

      ####################################################
      # Docker
      ####################################################

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Backend Image
      ####################################################

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      ####################################################
      # Frontend Image
      ####################################################

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main
          build-args: |
            VITE_API_URL=http://3.108.30.16
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=http://localhost:3002
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false