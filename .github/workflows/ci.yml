name: VeloCore CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout
      ####################################################

      - uses: actions/checkout@v4

      ####################################################
      # Node
      ####################################################

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ####################################################
      # Install
      ####################################################

      - name: Install Backend
        working-directory: backend
        run: npm ci

      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      ####################################################
      # Lint
      ####################################################

      - name: Backend Lint
        working-directory: backend
        run: npm run lint

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint

      ####################################################
      # Tests
      ####################################################

      - name: Backend Tests
        working-directory: backend
        run: npm test

      - name: Frontend Tests
        working-directory: frontend
        run: npm test

      ####################################################
      # Build
      ####################################################

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ####################################################
      # Docker
      ####################################################

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Backend Image
      ####################################################

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false

      ####################################################
      # Frontend Image
      ####################################################

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main

          build-args: |
            VITE_API_URL=http://15.206.203.121:8080
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=http://localhost:3002

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false

      ####################################################
      # Trivy
      ####################################################

      - name: Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      ####################################################
      # SBOM
      ####################################################

      - name: Generate Backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: frontend-sbom.spdx.json

      ####################################################
      # Upload SBOM
      ####################################################

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend-sbom.spdx.json
            frontend-sbom.spdx.json