name: VeloCore CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ##################################################
      # Backend
      ##################################################

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main

          labels: |
            org.opencontainers.image.title=VeloCore Backend
            org.opencontainers.image.source=https://github.com/shaurya-sehgal5/VeloCore
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false
          sbom: false

      ##################################################
      # Frontend
      ##################################################

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend

          push: true

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main

          build-args: |
            VITE_API_URL=http://localhost:8080
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=http://localhost:3002

          labels: |
            org.opencontainers.image.title=VeloCore Frontend
            org.opencontainers.image.source=https://github.com/shaurya-sehgal5/VeloCore
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false
          sbom: false

      ##################################################
      # Trivy
      ##################################################

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table