name: VeloCore Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GRAFANA_URL: ${{ secrets.VITE_GRAFANA_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_KUBERNETES_DASHBOARD_URL: ${{ secrets.VITE_KUBERNETES_DASHBOARD_URL }}
        run: npm run build

      - name: Backend npm audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan Backend Image with Trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:main
          docker push ${{ env.BACKEND_IMAGE }}:main

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=${{ secrets.VITE_GRAFANA_URL }}
            VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}
            VITE_KUBERNETES_DASHBOARD_URL=${{ secrets.VITE_KUBERNETES_DASHBOARD_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan Frontend Image with Trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --no-progress \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:main
          docker push ${{ env.FRONTEND_IMAGE }}:main

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      - name: Pipeline Summary
        if: always()
        run: |
          echo "## 🚀 VeloCore CI Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY