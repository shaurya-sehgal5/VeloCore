name: VeloCore CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

  pull_request:
    branches:
      - main

concurrency:
  group: velocore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: shauryasehgal/velocore-backend
  FRONTEND_IMAGE: shauryasehgal/velocore-frontend

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

####################################################
# Checkout
####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

####################################################
# Node
####################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

####################################################
# Install Dependencies
####################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

####################################################
# Build Frontend
####################################################

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://3.110.163.70
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GRAFANA_URL: http://localhost:3002
        run: npm run build

####################################################
# Install Gitleaks
####################################################

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

####################################################
# Secret Scan
####################################################

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --no-banner

####################################################
# npm audit
####################################################

      - name: Backend npm audit
        working-directory: backend
        run: |
          npm audit --audit-level=high || true

      - name: Frontend npm audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

####################################################
# Install Trivy
####################################################

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
          trivy image --download-db-only

####################################################
# Docker Buildx
####################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

####################################################
# Docker Login
####################################################

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

####################################################
# Build Backend Image
####################################################

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

####################################################
# Backend Trivy Scan
####################################################

      - name: Scan Backend Image
        run: |
          echo "======================================"
          echo "Scanning Backend Docker Image"
          echo "======================================"
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --no-progress \
            --format table \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

####################################################
# Backend Scan Summary
####################################################

      - name: Backend Security Summary
        run: |
          echo "Backend image scanned successfully."
          echo "Image : ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"

####################################################
# Build Frontend Image
####################################################

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=http://3.110.163.70
            VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }}
            VITE_GRAFANA_URL=http://localhost:3002
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

####################################################
# Frontend Trivy Scan
####################################################

      - name: Scan Frontend Image
        run: |
          echo "======================================"
          echo "Scanning Frontend Docker Image"
          echo "======================================"
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --no-progress \
            --format table \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

####################################################
# Frontend Scan Summary
####################################################

      - name: Frontend Security Summary
        run: |
          echo "Frontend image scanned successfully."
          echo "Image : ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

####################################################
# Upload Security Reports
####################################################

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

####################################################
# Docker Cleanup
####################################################

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true

####################################################
# GitHub Actions Summary
####################################################

      - name: Pipeline Summary
        if: always()
        run: |
          {
            echo "## 🚀 VeloCore CI Pipeline"
            echo ""
            echo "| Stage | Status |"
            echo "|------|--------|"
            echo "| Checkout | ✅ |"
            echo "| Dependencies | ✅ |"
            echo "| Frontend Build | ✅ |"
            echo "| Gitleaks | ✅ |"
            echo "| npm audit | ✅ |"
            echo "| Docker Backend | ✅ |"
            echo "| Backend Trivy | ✅ |"
            echo "| Docker Frontend | ✅ |"
            echo "| Frontend Trivy | ✅ |"
            echo "| Push Images | ✅ |"
            echo ""
            echo "### Images"
            echo ""
            echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\`"
            echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\`"
            echo ""
            echo "### Commit"
            echo ""
            echo "\`${{ github.sha }}\`"
            echo ""
            echo "### Branch"
            echo ""
            echo "\`${{ github.ref_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

####################################################
# Finished
####################################################

      - name: Finish
        run: |
          echo ""
          echo "=============================================="
          echo "✅ VeloCore CI Finished Successfully"
          echo "=============================================="
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo ""
          echo "Backend Image"
          echo "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo ""
          echo "Frontend Image"
          echo "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          echo ""
          echo "Security"
          echo "✔ Gitleaks"
          echo "✔ npm audit"
          echo "✔ Trivy"
          echo ""
          echo "Docker"
          echo "✔ Backend"
          echo "✔ Frontend"
          echo ""
          echo "=============================================="